question: "广告或商务套件里提示要做企业验证，这和 WhatsApp 绿标是一回事吗"
question_patterns:
  - "广告或商务套件里提示要做企业验证，这和 WhatsApp 绿标是一回事吗"
  - "广告要企业验证"
  - "Business Verification 广告怎么做"
  - "广告验证和绿标有什么区别"
  - "BM 要验证"
