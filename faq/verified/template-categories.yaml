conclusion: "平台版发「模板消息」时，官方只认三大类：营销、实用、验证码。建模板时必须选一类；选错会影响能不能过审，也会影响收费。"

answer: |
  **一句话：模板就三种——促销用的、办事通知用的、发验证码用的。建的时候必须选对。**

  ### 三种分别干什么
  1. **营销（Marketing）**  
     推活动、优惠、拉新、提醒客户别忘了你。最灵活。  
     注意：一条消息里既有「订单更新」又夹带促销，或内容说不清，官方也会算成营销。
  2. **实用（Utility）**  
     多半是客户先有动作之后才发：下单确认、物流、账户提醒、安全提醒等。  
     硬规矩：**不能带促销**；内容要跟订单／账户／交易相关，或对用户是必要的。
  3. **认证（Authentication）**  
     **只有这类能发验证码 / 一次性密码**（官方要求）。限制最严：固定话术，一般不能塞链接、图片、表情，可变内容也很短。

  ### 官方说明
  - [模板总览](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/overview)
  - [怎么分类](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/template-categorization)
  - [认证模板](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/authentication-templates/authentication-templates)
  - [实用模板](https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/utility-templates/utility-templates)

  ### 容易踩的坑
  - **类别不同，价钱不同**——选错可能更贵。
  - **实用模板里塞促销，系统可能直接改成营销**（官方要求）。自 2025-04-09 起，你交的是实用、系统认为该是营销时，可能直接按营销通过，60 天内可申请复核。
  - 标题、正文、按钮这些「零件」，和「营销/实用/认证」不是一回事，别混着问。

