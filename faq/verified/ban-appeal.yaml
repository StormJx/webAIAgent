question: "为什么老被封号，我新创建的账号怎么就会被封号限制，我该如何申诉"
question_patterns:
  - "为什么老被封号，我该如何申诉"
  - "账号被限制了怎么申诉"
  - "新账号为什么会被封"
  - "Request Review 怎么弄"
  - "违规了怎么恢复"
