conclusion: "退款、赔偿我处理不了，需要转人工。我只回答官方文档能支撑的问题，不能答应退钱，也不能替服务商或 Meta 出钱。"

answer: |
  **抱歉，退款 / 补偿这件事我帮不了，需要转人工。**

  我是「Meta 文档答疑员」，只根据官方文档解释规则。  
  **我不是 Meta 客服，也不是你付钱的那家服务商**，不能退款、不能赔偿、不能动账户或钱，也不会替你向 Meta 要补偿。

  ### 钱的事该找谁
  1. **跟 Meta 账单有争议** → 走 Meta 开发者支持（企业开发者可开官方直接支持工单）。
  2. **钱是付给第三方服务商的** → 找那家售后；我不能代表他们答应任何事。
  3. **只是对我上一句回答不满意** → 你可以换个具体文档问题让我重查；但退款 / 赔偿仍然超出我的职责。

  这类诉求不在自动解答范围，请转人工处理。

