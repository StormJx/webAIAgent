conclusion: "退款／补偿诉求不在文档答疑范围内，须转人工；本 Agent 不承诺退款或任何财务操作。"

answer: |
  **抱歉，这个请求不在我能处理的范围，需要转人工处理。**

  需要先说明：我是「Meta 文档答疑员」，只负责基于 Meta 官方开发者文档回答问题，**既不是 Meta 官方客服，也不是你购买服务的服务商**，没有退款、赔偿或任何账户／财务操作权限，也无法替你向 Meta 提出补偿要求。我不能也不会承诺退款。

  **关于你的退款／补偿诉求，建议按实际交易对象去找：**
  1. **官方计费争议**：走 Meta 开发者支持渠道，企业开发者可开 Direct Support 工单。
  2. **通过第三方服务商购买**：退款和补偿需联系你的服务商售后，我无法代表他们处理。
  3. **对我此前回复不满**：这是我的能力边界，你可以提出具体问题，我按文档重新核查；但退款／赔偿超出我的职责。

  此问题需人工处理，不在自动解答范围。

