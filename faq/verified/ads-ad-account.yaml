conclusion: "广告账户是用来花钱投放的户头。可以在商务资产组合里新建一个，也可以把已经存在的账户添加进来。没有可用账户，广告管理工具里的「创建」会没地方落。"

answer: |
  **一句话：广告账户 = 投放用的户头。在商务资产组合里「创建」或「添加」，再绑付款、给人开权限。**

  ### 这是啥
  广告账户带自己的编号、币种、时区、付款方式和权限名单。官方帮助中心有专门一篇「如何添加或创建广告账户」。

  ### 怎么做
  1. 打开商务套件：https://business.facebook.com
  2. 进入你要操作的商务资产组合。
  3. 走 **添加或创建广告账户**：
     - **创建**：为这个组合新建账户（名称、时区、币种等按页面填写；币种 / 时区一经设定通常很难改）。
     - **添加**：把已有广告账户声明进这个组合（你必须对那个账户有足够权限）。
  4. 建好后，再给同事开广告账户权限，并添加付款方式。
  5. 之后用广告管理工具选中这个账户，才能创建广告系列。

  ### 官方说明
  - [如何添加或创建广告账户](https://www.facebook.com/business/help/915885887059947)
  - [关于商务资产组合](https://www.facebook.com/business/help/1710077379203657)
  - [如何添加付款方式](https://www.facebook.com/business/help/132073386867900)
  - [广告账户权限](https://www.facebook.com/business/help/1143109949216644)

  ### 容易踩的坑
  - 时区和币种选错：后面账单和对账都会拧，创建前一定和客户确认主体所在地。
  - 个人户和资产组合里的户搞混：客户说「我后台看不到你说的菜单」，先对一下当前选中的是哪个账户。
  - 账户显示受限或不能创建广告：先看账户状态和付款，不要连续新建一堆户。
  - 开户额度、能不能再开新户：平台按风险和历史限制，文档没有「保证一定能开第 N 个户」，不要承诺。

