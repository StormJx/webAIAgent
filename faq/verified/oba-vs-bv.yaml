conclusion: "大家说的「绿标」，官方叫官方商业账号，名字旁边会有一个蓝色对勾。企业认证是先证明「公司是真的」；认证通过不会自动给绿标，还要再单独申请。"

answer: |
  **一句话：企业认证 = 证明公司是真的；绿标 = 额外申请的「官方号」信任标记。先认证，再申请绿标，认证完不会自动变绿标。**

  ### 两个东西分别是啥
  - **企业认证**：Meta 审核你的公司资质是不是真实、合法注册。
  - **官方商业账号**（常被叫绿标 / OBA）：通过认证的企业，其 WhatsApp 商务号码名称旁可带 **蓝色对勾**。  
    官方英文写的是 blue checkmark（蓝勾）；中文圈里很多人仍叫「绿标」。  
    它是展示用的信任标识，**不是**你使用平台版的前提。

  ### 申请绿标还要满足啥（官方要求）
  - 已完成企业认证（硬性条件之一）
  - 遵守商务消息政策
  - 在平台注册满 30 天
  - 号码开了两步验证
  - 显示名已通过审核

  在 WhatsApp Manager 里：手机号 → 资料 → Official business account → 提交申请；也可以走官方状态接口。  
  批不批由 Meta 决定；**被拒后要等 30 天才能再交。**

  ### 官方说明
  - [官方商业账号](https://developers.facebook.com/documentation/business-messaging/whatsapp/official-business-accounts)
  - [消息量限制](https://developers.facebook.com/documentation/business-messaging/whatsapp/messaging-limits)（完成企业认证后，起步额度常从 250 提到 2,000）
  - [显示名](https://developers.facebook.com/documentation/business-messaging/whatsapp/display-names)

  ### 容易踩的坑
  - 没有绿标的号，一般**不会出现在 WhatsApp 应用内搜索**里（除非客户手动存了你）。
  - 已经是绿标的号要改显示名，通常要走官方直接支持，不能当普通改名。

