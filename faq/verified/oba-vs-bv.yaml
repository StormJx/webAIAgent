conclusion: "OBA 是 Official Business Account（官方商业账号）；BV（Business Verification）是企业真实性验证。BV 是申请 OBA 的资格前提之一，完成 BV 不会自动获得 OBA。"

answer: |
  **OBA 是 Official Business Account（官方商业账号）的缩写**，指由已通过 Meta 真实性验证的企业所拥有的 WhatsApp 商务电话号码；这类号码在联系人视图中，名称旁边会带一个**蓝色对勾（blue checkmark，官方英文原文如此，中文业界常叫「绿标」）**。它本质是 Meta 授予的展示性信任标识，不是使用 WhatsApp Business Platform 的前提。

  BV（Business Verification，企业验证）则是 Meta 对企业真实、合法注册的资质审核。**两者关系一句话：BV 是 OBA 的资格前提之一——先做 BV，再单独申请 OBA；做完 BV 不会自动获得 OBA。**

  **官方文档来源：**
  - [official-business-accounts](https://developers.facebook.com/documentation/business-messaging/whatsapp/official-business-accounts)
  - [messaging-limits](https://developers.facebook.com/documentation/business-messaging/whatsapp/messaging-limits)（完成 BV 后消息量从 250 提升到 2,000）
  - [display-names](https://developers.facebook.com/documentation/business-messaging/whatsapp/display-names)

  **背景补充：** OBA 官方页面上，BV 被列为硬性资格条件之一（**此为 Meta 官方要求**）。要申请 OBA，官方列出的条件还包括：
  - 遵守 WhatsApp Business Messaging Policy；
  - 在 WhatsApp Business Platform 注册满 30 天；
  - 该号码已启用两步验证；
  - 该号码显示名已通过审核。

  申请入口：WhatsApp Manager（手机号 → Profile → Official business account → Submit Request），或通过 Official Business Account Status API 提交。是否授予由 Meta 酌情决定，**被拒后须等 30 天才能重新提交**。

  **容易踩的坑：**
  - 非 OBA 号码**不会出现在 WhatsApp 应用内搜索结果**中（除非用户手动添加为联系人）。
  - 已获 OBA 状态的号码要改显示名，需联系 direct support，不能走常规流程。

