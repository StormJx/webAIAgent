question: "请告诉我 OBA 是什么，跟企业认证 BV 有什么关系"
question_patterns:
  - "OBA 是什么，跟企业认证 BV 有什么关系"
  - "什么是 OBA"
  - "绿标是什么"
  - "企业认证和官方商业账号有什么区别"
  - "蓝标 / 绿色对勾是什么意思"
